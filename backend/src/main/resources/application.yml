spring:
  application:
    name: wida3-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-min: ${JWT_ACCESS_TOKEN_TTL_MIN:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}
  auth:
    max-failed-attempts: 5
    lockout-duration-min: 15
    rate-limit:
      capacity: 10
      refill-period-seconds: 60
  file-storage:
    path: ${FILE_STORAGE_PATH:./uploads}
    max-size-mb: 5
    max-photos-per-listing: 10
    allowed-content-types: image/jpeg,image/png,image/webp
  payment:
    mock:
      always-succeed: ${PAYMENT_MOCK_ALWAYS_SUCCEED:true}
