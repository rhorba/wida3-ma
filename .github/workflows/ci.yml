name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck & build
        run: npm run build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      # Reuses the Maven cache the backend job just populated (same cache key, since this is
      # the same setup-java action + cache: maven config) so Trivy's pom.xml parent-POM lookups
      # resolve from the local .m2 instead of hitting Maven Central, which rate-limits shared
      # GitHub Actions runner IPs (429 Too Many Requests) when scanning cold.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 1

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/owasp-top-ten

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wida3
          POSTGRES_USER: wida3_app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/wida3
      DB_USER: wida3_app
      DB_PASSWORD: ci_test_password
      JWT_SECRET: ci-e2e-test-secret-do-not-use-in-prod-0123456789
      JWT_REFRESH_COOKIE_SECURE: "false"
      PAYMENT_MOCK_ALWAYS_SUCCEED: "true"
      FILE_STORAGE_PATH: /tmp/wida3-uploads
      PGPASSWORD: ci_test_password
      E2E_DB_EXEC: psql -h localhost -p 5432 -U wida3_app -d wida3
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package backend (tests already run in the backend job)
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Start backend
        working-directory: backend
        run: nohup java -jar target/*.jar > backend.log 2>&1 &
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/v1/listings/search && exit 0
            sleep 2
          done
          echo "Backend did not become ready in time" && cat backend/backend.log && exit 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        # VITE_API_BASE_URL=/api/v1 routes API calls through Vite's dev proxy (vite.config.ts)
        # instead of straight to localhost:8080, so the browser sees a same-origin request --
        # the backend has no CORS config, so a cross-origin call would be silently blocked.
        env:
          VITE_API_BASE_URL: /api/v1
        run: nohup npx vite --port 5176 --strictPort > frontend.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5176 && exit 0
            sleep 2
          done
          echo "Frontend did not become ready in time" && cat frontend/frontend.log && exit 1
      - name: Run Playwright critical-flow tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload e2e recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-recordings
          path: .recordings/raw
          retention-days: 14
          if-no-files-found: warn
